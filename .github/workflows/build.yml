name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify and Collect APKs
        run: |
          echo "=== All APKs found across repository ==="
          find . -type f -name "*.apk"

          mkdir -p release-apks

          if [ -d "android/examples/bin" ]; then
            echo "Copying APKs from android/examples/bin/..."
            cp -v android/examples/bin/*.apk release-apks/ 2>/dev/null || true
          fi

          # Collect any additional APKs, ignoring intermediate build dirs and already gathered files
          find . -type f -name "*.apk" ! -path "*/intermediates/*" ! -path "*/release-apks/*" -exec cp -uv {} release-apks/ \;

          echo "=== Gathered APKs in release-apks/ ==="
          ls -lh release-apks/

          APK_COUNT=$(ls -1 release-apks/*.apk 2>/dev/null | wc -l)
          echo "Total APKs collected: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK files found after build!"
            exit 1
          fi

          echo "Compressing APKs into all-vulkan-apks.zip..."
          (cd release-apks && zip -9 -r ../all-vulkan-apks.zip .)
          ls -lh all-vulkan-apks.zip

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.sha }}
          name: Nightly Build (${{ github.sha }})
          generate_release_notes: true
          files: |
            all-vulkan-apks.zip
            release-apks/*.apk
          fail_on_unmatched_files: true
